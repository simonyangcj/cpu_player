[project]
name = "cpu-piano"
version = "0.1.0"
description = "用 CPU 使用率弹钢琴：每个核心是一个琴键"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=6.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "rich>=13.0",
]

[project.optional-dependencies]
midi = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.scripts]
cpu-piano = "cpu_piano.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpu_piano"]
